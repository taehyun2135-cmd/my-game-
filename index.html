<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="미니 브롤">
  <title>아이폰 미니 브롤</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #2C3E50; font-family: -apple-system, BlinkMacSystemFont, sans-serif; touch-action: none; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let w = window.innerWidth;
    let h = window.innerHeight;
    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let state = 'START'; // START, PLAY, OVER
    let kills = 0;

    const p = { x: 0, y: 0, r: 22, speed: 4.5, hp: 100, maxHp: 100, ammo: 3, maxAmmo: 3, reload: 0, ult: 0, lastHit: 0, angle: -Math.PI / 2 };
    let bullets = [];
    let enemyBullets = [];
    let enemies = [];
    let walls = [];

    let moveTouch = { id: null, sx: 0, sy: 0, cx: 0, cy: 0 };
    let aimTouch = { id: null, sx: 0, sy: 0, cx: 0, cy: 0 };

    function initGame() {
      state = 'PLAY';
      kills = 0;
      p.x = w / 2;
      p.y = h * 0.78;
      p.hp = 100;
      p.ammo = 3;
      p.ult = 0;
      bullets = [];
      enemyBullets = [];
      enemies = [];
      moveTouch.id = null;
      aimTouch.id = null;

      walls = [
        { x: w * 0.18, y: h * 0.25, w: 60, h: 60 },
        { x: w * 0.82 - 60, y: h * 0.25, w: 60, h: 60 },
        { x: w * 0.18, y: h * 0.68 - 60, w: 60, h: 60 },
        { x: w * 0.82 - 60, y: h * 0.68 - 60, w: 60, h: 60 },
        { x: w * 0.5 - 45, y: h * 0.48 - 20, w: 90, h: 40 }
      ];

      for (let i = 0; i < 3; i++) spawnEnemy();
    }

    function spawnEnemy() {
      const side = Math.floor(Math.random() * 4);
      let ex = side === 0 ? 30 : side === 1 ? w - 30 : Math.random() * (w - 60) + 30;
      let ey = side === 2 ? 60 : side === 3 ? h - 30 : Math.random() * (h - 100) + 50;
      enemies.push({ x: ex, y: ey, r: 20, hp: 100, maxHp: 100, speed: 2.0 + Math.min(1.5, kills * 0.05), cd: 70 });
    }

    function checkWall(nx, ny, r) {
      for (let i = 0; i < walls.length; i++) {
        const wl = walls[i];
        if (nx + r > wl.x && nx - r < wl.x + wl.w && ny + r > wl.y && ny - r < wl.y + wl.h) return true;
      }
      return false;
    }

    function shoot() {
      if (p.ammo < 1) return;
      p.ammo--;
      let ang = p.angle;
      const dx = aimTouch.cx - aimTouch.sx;
      const dy = aimTouch.cy - aimTouch.sy;

      if (Math.hypot(dx, dy) > 12) {
        ang = Math.atan2(dy, dx);
      } else if (enemies.length > 0) {
        let nearest = enemies[0];
        let minDist = Math.hypot(p.x - nearest.x, p.y - nearest.y);
        for (let i = 1; i < enemies.length; i++) {
          const d = Math.hypot(p.x - enemies[i].x, p.y - enemies[i].y);
          if (d < minDist) { minDist = d; nearest = enemies[i]; }
        }
        ang = Math.atan2(nearest.y - p.y, nearest.x - p.x);
      }
      p.angle = ang;
      bullets.push({ x: p.x, y: p.y, vx: Math.cos(ang) * 11, vy: Math.sin(ang) * 11, r: 7, dmg: 35, life: 45, isUlt: false });
    }

    function useUlt() {
      if (p.ult < 100) return;
      p.ult = 0;
      for (let i = 0; i < 16; i++) {
        const ang = (Math.PI * 2 / 16) * i;
        bullets.push({ x: p.x, y: p.y, vx: Math.cos(ang) * 12, vy: Math.sin(ang) * 12, r: 10, dmg: 60, life: 50, isUlt: true });
      }
    }

    function handleStartInput(x, y) {
      if (state !== 'PLAY') {
        initGame();
        return;
      }
      // 궁극기 버튼 터치 체크 (오른쪽 아래)
      const ultX = w - 65;
      const ultY = h - 150;
      if (Math.hypot(x - ultX, y - ultY) < 42 && p.ult >= 100) {
        useUlt();
        return;
      }

      if (x < w / 2 && moveTouch.id === null) {
        moveTouch = { id: 'mouse', sx: x, sy: y, cx: x, cy: y };
      } else if (x >= w / 2 && aimTouch.id === null) {
        aimTouch = { id: 'mouse', sx: x, sy: y, cx: x, cy: y };
      }
    }

    canvas.addEventListener('touchstart', function(e) {
      e.preventDefault();
      if (state !== 'PLAY') {
        initGame();
        return;
      }
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        const ultX = w - 65;
        const ultY = h - 150;
        if (Math.hypot(t.clientX - ultX, t.clientY - ultY) < 45 && p.ult >= 100) {
          useUlt();
          continue;
        }
        if (t.clientX < w / 2 && moveTouch.id === null) {
          moveTouch = { id: t.identifier, sx: t.clientX, sy: t.clientY, cx: t.clientX, cy: t.clientY };
        } else if (t.clientX >= w / 2 && aimTouch.id === null) {
          aimTouch = { id: t.identifier, sx: t.clientX, sy: t.clientY, cx: t.clientX, cy: t.clientY };
        }
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', function(e) {
      e.preventDefault();
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        if (t.identifier === moveTouch.id) { moveTouch.cx = t.clientX; moveTouch.cy = t.clientY; }
        if (t.identifier === aimTouch.id) { aimTouch.cx = t.clientX; aimTouch.cy = t.clientY; }
      }
    }, { passive: false });

    canvas.addEventListener('touchend', function(e) {
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        if (t.identifier === moveTouch.id) moveTouch.id = null;
        if (t.identifier === aimTouch.id) {
          if (state === 'PLAY') shoot();
          aimTouch.id = null;
        }
      }
    });

    // PC 클릭 테스트용 겸용
    canvas.addEventListener('mousedown', function(e) { handleStartInput(e.clientX, e.clientY); });
    canvas.addEventListener('mousemove', function(e) {
      if (moveTouch.id === 'mouse') { moveTouch.cx = e.clientX; moveTouch.cy = e.clientY; }
      if (aimTouch.id === 'mouse') { aimTouch.cx = e.clientX; aimTouch.cy = e.clientY; }
    });
    canvas.addEventListener('mouseup', function() {
      if (moveTouch.id === 'mouse') moveTouch.id = null;
      if (aimTouch.id === 'mouse') { if (state === 'PLAY') shoot(); aimTouch.id = null; }
    });

    function drawStartOrOver() {
      ctx.fillStyle = '#2C3E50';
      ctx.fillRect(0, 0, w, h);

      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.beginPath();
      ctx.roundRect(w * 0.1, h * 0.25, w * 0.8, h * 0.5, 24);
      ctx.fill();

      ctx.textAlign = 'center';
      ctx.fillStyle = '#FFD60A';
      ctx.font = '900 34px -apple-system, sans-serif';
      ctx.fillText(state === 'START' ? 'MINI BRAWL' : '전투 패배!', w / 2, h * 0.36);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = '600 16px -apple-system, sans-serif';
      if (state === 'START') {
        ctx.fillText('왼쪽 화면 드래그: 이동', w / 2, h * 0.44);
        ctx.fillText('오른쪽 화면 터치/드래그: 사격', w / 2, h * 0.49);
      } else {
        ctx.fillText(`총 처치한 적: ${kills}명`, w / 2, h * 0.46);
      }

      // 시작 버튼 그래픽
      ctx.fillStyle = '#FFD60A';
      ctx.beginPath();
      ctx.roundRect(w * 0.2, h * 0.58, w * 0.6, 56, 16);
      ctx.fill();

      ctx.fillStyle = '#000000';
      ctx.font = '900 20px -apple-system, sans-serif';
      ctx.fillText(state === 'START' ? '화면을 터치해서 시작' : '다시 도전하기', w / 2, h * 0.58 + 35);
    }

    function loop() {
      if (state !== 'PLAY') {
        drawStartOrOver();
        requestAnimationFrame(loop);
        return;
      }

      ctx.fillStyle = '#3B6E51';
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = 'rgba(255,255,255,0.06)';
      ctx.lineWidth = 1;
      for (let x = 0; x < w; x += 50) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
      for (let y = 0; y < h; y += 50) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }

      // 벽
      for (let i = 0; i < walls.length; i++) {
        const wl = walls[i];
        ctx.fillStyle = '#8D6E63';
        ctx.fillRect(wl.x, wl.y, wl.w, wl.h);
        ctx.strokeStyle = '#5D4037';
        ctx.lineWidth = 3;
        ctx.strokeRect(wl.x, wl.y, wl.w, wl.h);
      }

      // 재장전 & 체력 회복
      if (p.ammo < p.maxAmmo) {
        p.reload++;
        if (p.reload > 50) { p.ammo++; p.reload = 0; }
      }
      if (Date.now() - p.lastHit > 3000 && p.hp < p.maxHp) {
        p.hp = Math.min(p.maxHp, p.hp + 0.15);
      }

      // 이동 처리
      if (moveTouch.id !== null) {
        const dx = moveTouch.cx - moveTouch.sx;
        const dy = moveTouch.cy - moveTouch.sy;
        if (Math.hypot(dx, dy) > 5) {
          const ang = Math.atan2(dy, dx);
          p.angle = ang;
          const nx = Math.max(p.r, Math.min(w - p.r, p.x + Math.cos(ang) * p.speed));
          const ny = Math.max(p.r, Math.min(h - p.r, p.y + Math.sin(ang) * p.speed));
          if (!checkWall(nx, p.y, p.r)) p.x = nx;
          if (!checkWall(p.x, ny, p.r)) p.y = ny;
        }
      }

      // 조준선
      if (aimTouch.id !== null) {
        const dx = aimTouch.cx - aimTouch.sx;
        const dy = aimTouch.cy - aimTouch.sy;
        const ang = Math.hypot(dx, dy) > 12 ? Math.atan2(dy, dx) : p.angle;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = 14;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x + Math.cos(ang) * 180, p.y + Math.sin(ang) * 180);
        ctx.stroke();
      }

      // 플레이어
      ctx.fillStyle = '#0A84FF';
